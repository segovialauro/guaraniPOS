spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/guarani_pos}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=America/Asuncion
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

server.port=${PORT:8080}

app.jwt.secret=${APP_JWT_SECRET:5Wc6ojfL6a5SEcFKW1d6G8SkVv0v6cJfV2qZP1xUqM9xP0eJxB3wQm4nY8rL7tAa}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

app.tenancy.shared-datasource-key=shared
